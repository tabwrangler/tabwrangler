name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

env:
  NODE_VERSION: 24.x

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check-types

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run test

  build:
    needs: [check-types, lint, test]
    runs-on: ubuntu-latest

    # Attestation permissions are scoped to this job so other jobs running `npm ci --no-audit --no-fund` can't mint OIDC
    # tokens. Job-level permissions replace the workflow's, so `contents: read` is repeated.
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from package.json, name it $PACKAGE_VERSION
        run: |
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Generate artifact attestations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: "dist/tabwrangler-*.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: tabwrangler-builds-${{ env.PACKAGE_VERSION }}
          path: dist/tabwrangler-*.zip
          if-no-files-found: error
